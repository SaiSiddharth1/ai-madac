version: "3.9"

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: madac_postgres
    environment:
      POSTGRES_USER: madac_user
      POSTGRES_PASSWORD: madac_password
      POSTGRES_DB: ai_madac
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U madac_user -d ai_madac"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: madac_backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://madac_user:madac_password@postgres:5432/ai_madac
      DATABASE_URL_SYNC: postgresql://madac_user:madac_password@postgres:5432/ai_madac
      FRONTEND_URL: http://localhost:3000
    env_file:
      - .env
    volumes:
      - ./backend:/app
      - backend_uploads:/app/uploads
      - backend_charts:/app/charts
      - backend_models:/app/models
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Next.js Frontend (Phase 1 — added once frontend is ready)
  # frontend:
  #   build:
  #     context: ./frontend
  #     dockerfile: Dockerfile
  #   container_name: madac_frontend
  #   ports:
  #     - "3000:3000"
  #   environment:
  #     NEXT_PUBLIC_API_URL: http://localhost:8000
  #   depends_on:
  #     - backend

volumes:
  postgres_data:
  backend_uploads:
  backend_charts:
  backend_models:
